trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  CI_PLATFORM: 'Azure Pipelines'
  NODE_VERSION: '24.x'

steps:

  # ----------------------------------------
  # Node.js
  # ----------------------------------------
  - task: UseNode@1
    inputs:
      version: '$(NODE_VERSION)'
    displayName: 'Install Node.js'

  # ----------------------------------------
  # Dependencies
  # ----------------------------------------
  - script: npm ci
    displayName: 'Install dependencies'

  # ----------------------------------------
  # Playwright browsers
  # ----------------------------------------
  - script: npx playwright install --with-deps
    displayName: 'Install Playwright browsers'

  # ----------------------------------------
  # BDD tests
  # ----------------------------------------
  - script: npm run test:bdd
    displayName: 'Run BDD suite'
    continueOnError: true

  # ----------------------------------------
  # UI tests
  # ----------------------------------------
  - script: npm run test:ui
    displayName: 'Run UI suite'
    continueOnError: true

  # ----------------------------------------
  # API tests
  # ----------------------------------------
  - script: npm run test:api
    displayName: 'Run API suite'
    continueOnError: true

  # ----------------------------------------
  # Playwright HTML report
  # ----------------------------------------
  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: 'playwright-report'
      artifact: 'playwright-report'
    displayName: 'Publish Playwright HTML report'

  # ----------------------------------------
  # Excel QA report
  # ----------------------------------------
  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: 'reports/QA_Status_Report.xlsx'
      artifact: 'qa-status-report'
    displayName: 'Publish Excel QA status report'