# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include: [main]

pool:
  vmImage: 'ubuntu-latest'

variables:
  CI_PLATFORM: 'Azure Pipelines'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps
    displayName: 'Install Playwright browsers'

  - script: npm run test:bdd
    displayName: 'Run BDD suite'
    continueOnError: true

  - script: npm run test:ui
    displayName: 'Run UI suite'
    continueOnError: true

  - script: npm run test:api
    displayName: 'Run API suite'
    continueOnError: true


  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: 'playwright-report'
      artifact: 'playwright-report'
    displayName: 'Publish Playwright HTML report'

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: 'reports/QA_Status_Report.xlsx'
      artifact: 'qa-status-report'
    displayName: 'Publish Excel QA status report'